# mixed 模式声明全部可检索资料；source/sources 只做精确筛选。
# 根目录均相对此 YAML，可随源码 Skill 搬移。
sources:
  - id: luadraw
    root: ../..
    include:
      - vendor/luadraw-3.7/luadraw/**
      - docs/luadraw-surface-rendering.md
      - knowledge/luadraw/**/*.md
    notes_dir: knowledge/luadraw
    # 跳过无关项目目录的遍历；不影响下面独立的 Asymptote 来源。
    exclude: [.git/**, build/**, runs/**, dist/**, .deps/**, dev/**, go/**, scripts/**]
  - id: asymptote
    root: ../..
    include:
      - vendor/asymptote-3.16/**
      - knowledge/asymptote/**/*.md
    notes_dir: knowledge/asymptote
    exclude: [.git/**, build/**, runs/**, dist/**, .deps/**, dev/**, go/**, scripts/**]
output:
  version: 2
  include_bbox: false
